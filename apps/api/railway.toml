[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && pnpm install && pnpm --filter database exec prisma generate && pnpm --filter api build"

[deploy]
startCommand = "cd ../.. && pnpm --filter database exec prisma migrate deploy && cd apps/api && node dist/index.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
name = "allohq-api"
