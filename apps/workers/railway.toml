[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && pnpm install && pnpm --filter database exec prisma generate && pnpm --filter workers build"

[deploy]
startCommand = "cd ../.. && pnpm --filter database exec prisma migrate deploy && cd apps/workers && node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
name = "allohq-workers"
