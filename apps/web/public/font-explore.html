<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlloHQ — Font & Typography Exploration (Warm Cream)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=Inconsolata:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=Ubuntu+Mono:wght@400;700&family=Quicksand:wght@400;500;600;700&family=Victor+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { background: #faf8f5; color: #2c2418; min-height: 100vh; }

  /* Warm Cream Palette */
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2c2418; --text-secondary: #8a7e6d;
    --border: #e8e2d8; --border-light: #f0ebe3; --accent: #c4956a;
    --accent-bg: #fdf5ee; --accent-text: #8b5e3c; --cta: #3d3529;
    --input-bg: #f5f1ec; --green: #5f8c5a; --green-bg: #f0f5ef;
  }

  /* Option Picker */
  .picker-bar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(250,248,245,0.92); backdrop-filter: blur(16px);
    padding: 14px 32px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .picker-label {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary);
    margin-right: 6px;
  }
  .picker-btn {
    padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--card); font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: all 0.2s;
  }
  .picker-btn:hover { border-color: var(--accent); }
  .picker-btn.active {
    border-color: var(--cta); background: var(--cta); color: var(--card);
  }
  .picker-note {
    margin-left: auto; font-family: 'Inter', sans-serif;
    font-size: 11px; color: var(--text-secondary); font-style: italic;
  }

  .options-grid {
    display: grid; grid-template-columns: 1fr; gap: 0;
    max-width: 1400px; margin: 0 auto;
  }

  /* Each full-width option */
  .option {
    padding: 48px 48px 56px; border-bottom: 1px solid var(--border);
    display: none;
  }
  .option.visible { display: block; }
  .option-header {
    display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px;
  }
  .option-number {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--accent); letter-spacing: 1px; text-transform: uppercase;
  }
  .option-name {
    font-size: 20px; font-weight: 700; color: var(--text);
    /* font set per option */
  }
  .option-desc {
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-secondary);
    line-height: 1.6; max-width: 600px;
  }
  .option-tags {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .option-tag {
    font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px; background: var(--accent-bg);
    color: var(--accent-text); letter-spacing: 0.3px;
  }

  /* Dashboard preview inside each option */
  .preview {
    display: flex; gap: 0; background: var(--bg);
    border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; margin-top: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }

  /* Sidebar preview */
  .prev-sidebar {
    width: 220px; flex-shrink: 0; background: var(--bg);
    border-right: 1px solid var(--border); padding: 20px 0;
  }
  .prev-logo { padding: 0 20px 16px; border-bottom: 1px solid var(--border-light); }
  .prev-logo-text { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .prev-logo-sub { font-size: 8px; color: var(--text-secondary); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
  .prev-nav { padding: 12px 10px; }
  .prev-nav-item {
    padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    color: var(--text-secondary); margin-bottom: 1px; cursor: default;
    display: flex; align-items: center; gap: 10px;
  }
  .prev-nav-item.active { background: var(--cta); color: #faf8f5; font-weight: 600; }
  .prev-nav-item svg { width: 14px; height: 14px; opacity: 0.5; }
  .prev-nav-item.active svg { opacity: 1; }

  /* Main content preview */
  .prev-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .prev-topbar {
    height: 48px; border-bottom: 1px solid var(--border);
    background: var(--card); display: flex; align-items: center; padding: 0 20px;
  }
  .prev-search {
    flex: 1; max-width: 400px; padding: 7px 12px 7px 32px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--input-bg); font-size: 12px;
    color: var(--text-secondary);
  }
  .prev-content { flex: 1; padding: 20px; overflow: hidden; }

  /* Dashboard cards inside preview */
  .prev-header-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .prev-h1 { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; margin-bottom: 3px; }
  .prev-subtitle { font-size: 12px; color: var(--text-secondary); }
  .prev-status { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .prev-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .prev-status-text { font-size: 11px; color: var(--text-secondary); }

  .prev-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .prev-stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .prev-stat-label {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 6px;
  }
  .prev-stat-value { font-size: 22px; font-weight: 700; color: var(--text); }

  /* Checklist */
  .prev-checklist {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; margin-bottom: 16px;
  }
  .prev-check-header {
    padding: 14px 16px; border-bottom: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between;
  }
  .prev-check-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .prev-check-count { font-size: 11px; color: var(--text-secondary); }
  .prev-check-bar { height: 4px; background: var(--border-light); margin: 0 16px; border-radius: 2px; }
  .prev-check-fill { height: 100%; width: 60%; background: var(--accent); border-radius: 2px; }
  .prev-step {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border-light);
  }
  .prev-step:last-child { border-bottom: none; }
  .prev-step-dot {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; flex-shrink: 0;
  }
  .prev-step-dot.done { background: var(--cta); color: #faf8f5; }
  .prev-step-dot.next { border: 2px solid var(--accent); color: var(--text); }
  .prev-step-dot.pending { border: 2px solid var(--border); color: var(--text-secondary); }
  .prev-step-label { font-size: 12px; font-weight: 600; color: var(--text); }
  .prev-step-desc { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
  .prev-step.done-row { opacity: 0.5; }
  .prev-step.done-row .prev-step-label { text-decoration: line-through; }
  .prev-step-cta {
    margin-left: auto; padding: 6px 14px; border-radius: 8px;
    background: var(--cta); color: #faf8f5; font-size: 11px;
    font-weight: 600; white-space: nowrap; border: none;
  }

  /* Activity table */
  .prev-table {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .prev-table-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border-light);
    display: flex; align-items: center; gap: 10px;
  }
  .prev-table-bar { width: 2px; height: 16px; background: var(--accent); border-radius: 1px; }
  .prev-table-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .prev-trow {
    display: grid; grid-template-columns: 1fr 1.5fr 1fr 1fr;
    padding: 10px 16px; border-bottom: 1px solid var(--border-light);
    font-size: 12px;
  }
  .prev-trow.thead { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600; }
  .prev-trow .bold { font-weight: 700; color: var(--text); }
  .prev-trow .muted { color: var(--text-secondary); }

  /* AI Panel */
  .prev-ai {
    width: 280px; flex-shrink: 0; background: #fdf9f5;
    border-left: 1px solid var(--border); display: flex;
    flex-direction: column;
  }
  .prev-ai-header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .prev-ai-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .prev-ai-title { font-size: 12px; font-weight: 700; color: var(--text); }
  .prev-ai-sub { font-size: 9px; color: var(--text-secondary); }
  .prev-ai-body { flex: 1; padding: 14px; overflow: hidden; }
  .prev-ai-msg { font-size: 12px; color: var(--text); line-height: 1.6; margin-bottom: 12px; }
  .prev-ai-insight {
    background: var(--accent-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; margin-bottom: 12px;
  }
  .prev-ai-insight-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-text); margin-bottom: 4px; }
  .prev-ai-insight-value { font-size: 12px; font-weight: 600; color: var(--text); }
  .prev-ai-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .prev-ai-pill {
    padding: 5px 10px; border-radius: 16px; background: var(--accent-bg);
    border: 1px solid var(--border); color: var(--accent-text);
    font-size: 10px; white-space: nowrap;
  }
  .prev-ai-input-area { padding: 12px 16px; border-top: 1px solid var(--border); }
  .prev-ai-input {
    width: 100%; padding: 8px 12px; border-radius: 10px;
    background: var(--input-bg); border: 1px solid var(--border);
    font-size: 11px; color: var(--text-secondary); outline: none;
  }

  /* Show All toggle */
  .show-all-bar {
    text-align: center; padding: 20px;
  }
  .show-all-btn {
    padding: 10px 24px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--card); font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600; color: var(--text);
    cursor: pointer; transition: all 0.2s;
  }
  .show-all-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
</style>
</head>
<body>

<!-- Option Picker -->
<div class="picker-bar" id="pickerBar">
  <span class="picker-label">Font Combo</span>
  <!-- Buttons injected by JS -->
  <span class="picker-note">Click to preview each — or "Show All" to compare</span>
</div>

<div class="options-grid" id="optionsGrid">
  <!-- Options injected by JS -->
</div>

<div class="show-all-bar">
  <button class="show-all-btn" onclick="showAll()">Show All Side by Side</button>
</div>

<script>
const OPTIONS = [
  {
    id: 'v3',
    name: 'V3 Original — JetBrains Mono everywhere',
    sans: "'Inter'",
    mono: "'JetBrains Mono'",
    desc: 'The exact v3 warm cream typography. JetBrains Mono is the dominant UI font for everything — headings, nav, labels, values, buttons, tables. Inter is only used for AI chat message bodies. Specific sizes: heading 22px, stats 28px, nav 13px, labels 10px uppercase with 1px spacing.',
    tags: ['V3 Original', 'Mono-dominant', 'Soothing'],
    isV3: true,
  },
  {
    id: 'a',
    name: 'Inter + JetBrains Mono',
    sans: "'Inter'",
    mono: "'JetBrains Mono'",
    desc: 'The current combination. Inter is clean and neutral, JetBrains Mono is a popular coding font. Functional but can feel a bit "developer tool".',
    tags: ['Current', 'Developer-friendly', 'Neutral'],
  },
  {
    id: 'b',
    name: 'DM Sans + DM Mono',
    sans: "'DM Sans'",
    mono: "'DM Mono'",
    desc: 'Geometric humanist design by Colophon Foundry. Softer, rounder letterforms than Inter. The mono variant has a warm, friendly character. Great for making data feel approachable.',
    tags: ['Recommended', 'Warm', 'Friendly', 'Cohesive'],
  },
  {
    id: 'c',
    name: 'Plus Jakarta Sans + Fira Code',
    sans: "'Plus Jakarta Sans'",
    mono: "'Fira Code'",
    desc: 'Jakarta Sans has soft, slightly rounded terminals that feel warm and inviting. Fira Code adds ligatures and a distinctive character to data/code elements. Premium feel.',
    tags: ['Premium', 'Soft', 'Modern'],
  },
  {
    id: 'd',
    name: 'Outfit + Source Code Pro',
    sans: "'Outfit'",
    mono: "'Source Code Pro'",
    desc: 'Outfit is a geometric sans with generous x-height and open counters — very readable and friendly. Source Code Pro by Adobe is elegant and refined for mono text.',
    tags: ['Open', 'Readable', 'Refined'],
  },
  {
    id: 'e',
    name: 'Manrope + IBM Plex Mono',
    sans: "'Manrope'",
    mono: "'IBM Plex Mono'",
    desc: 'Manrope is a modern geometric sans with slightly quirky character. IBM Plex Mono is authoritative yet warm — designed to feel human, not robotic. Professional and trustworthy.',
    tags: ['Professional', 'Trustworthy', 'Human'],
  },
  {
    id: 'f',
    name: 'Sora + Space Mono',
    sans: "'Sora'",
    mono: "'Space Mono'",
    desc: 'Sora has a futuristic-yet-friendly quality with perfectly balanced proportions. Space Mono adds a retro-tech charm. Together they feel like "AI from the future that cares about you."',

  {
    id: 'g',

  {

    tags: ['Harmonious', 'Corporate-warm', 'Polished'],

  {
    id: 'i',
    name: 'Nunito Sans + Inconsolata',
    sans: "'Nunito Sans'",

  {
    id: 'j',
    name: 'Rubik + Roboto Mono',

  {
    id: 'k',
    name: 'Karla + Ubuntu Mono',

    desc: 'Karla is a grotesque with a humanist soul — open apertures and generous spacing make it incredibly readable. Ubuntu Mono has a distinctive warmth (designed for Ubuntu Linux) with unique character shapes.',
    tags: ['Humanist', 'Open', 'Distinctive'],
  },
  {
    id: 'l',
    name: 'Quicksand + Victor Mono',
    sans: "'Quicksand'",

    tags: ['Popular', 'Geometric', 'Balanced'],
  },
  {
    id: 'n',
    name: 'Outfit + Inconsolata',
    sans: "'Outfit'",
    mono: "'Inconsolata'",

  },

// Inject picker buttons
const pickerBar = document.getElementById('pickerBar');
const note = pickerBar.querySelector('.picker-note');
OPTIONS.forEach((opt, i) => {
  const btn = document.createElement('button');
  btn.className = 'picker-btn' + (i === 0 ? ' active' : '');
  btn.textContent = opt.isV3 ? '★ V3 Original' : opt.name.split(' + ')[0]; // Short label
  btn.onclick = () => selectOption(opt.id);
  btn.dataset.id = opt.id;
  pickerBar.insertBefore(btn, note);
});

// Generate preview HTML for each option
function makePreview(opt) {
  const sf = opt.sans;
  const mf = opt.mono;

  // V3 original uses exact sizes/weights/spacing from the original mockup
  if (opt.isV3) {
    return `
    <div class="option visible" id="opt-${opt.id}" data-id="${opt.id}">
      <div class="option-header">
        <span class="option-number" style="color: var(--green); font-weight: 800;">★ V3 ORIGINAL</span>
        <span class="option-name" style="font-family: 'JetBrains Mono', monospace; letter-spacing: -0.5px;">${opt.name}</span>
      </div>
      <div class="option-desc">${opt.desc}</div>
      <div class="option-tags">${opt.tags.map(t => `<span class="option-tag">${t}</span>`).join('')}</div>

      <div class="preview">
        <!-- Sidebar -->
        <div class="prev-sidebar">
          <div class="prev-logo">
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.5px;">ALLOHQ</div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-secondary); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px;">MARKETING AUTOMATION</div>
          </div>
          <div class="prev-nav">
            ${['Dashboard','Customers','Segments','Intelligence','Templates','Campaigns','Automations','Analytics','Settings'].map((n, i) =>
              `<div class="prev-nav-item${i===0 ? ' active' : ''}" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: ${i===0 ? '600' : '400'};">${n}</div>`
            ).join('')}
          </div>
        </div>

        <!-- Main -->
        <div class="prev-main">
          <div class="prev-topbar">
            <div class="prev-search" style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">Tell AlloHQ what to do...&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;⌘K</div>
          </div>
          <div class="prev-content">
            <!-- Header -->
            <div class="prev-header-card">
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; margin-bottom: 3px;">DASHBOARD</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-secondary);">AlloHQ — Marketing automation for e-commerce</div>
              <div class="prev-status">
                <div class="prev-status-dot"></div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary);">API connected</div>
              </div>
            </div>

            <!-- Stats -->
            <div class="prev-stats">
              ${[['Total Customers','2,847'],['Active Campaigns','3'],['Revenue This Month','$48,290']].map(([l,v]) => `
                <div class="prev-stat">
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 6px;">${l}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums;">${v}</div>
                </div>
              `).join('')}
            </div>

            <!-- Checklist -->
            <div class="prev-checklist">
              <div class="prev-check-header">
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--text);">GET_STARTED</div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary);">3/5 complete</div>
              </div>
              <div class="prev-check-bar"><div class="prev-check-fill"></div></div>
              ${[
                {l:'Connect your store', d:'Link your Shopify store', done:true},
                {l:'Sync store data', d:'Import products, customers, orders', done:true},
                {l:'Choose AI model', d:'Select default model for content', done:true},
                {l:'Analyze brand voice', d:'AI extracts personality and tone', done:false, next:true},
                {l:'Launch AI Agent', d:'Generate emails, SMS, WhatsApp, RCS', done:false},
              ].map((s,i) => `
                <div class="prev-step${s.done ? ' done-row' : ''}">

  // All other options use the standard template

// Render all options
const grid = document.getElementById('optionsGrid');
grid.innerHTML = OPTIONS.map(o => makePreview(o)).join('');

// Select one option
let showingAll = false;
function selectOption(id) {
  showingAll = false;
  document.querySelectorAll('.option').forEach(el => {
    el.classList.toggle('visible', el.dataset.id === id);
  });
  document.querySelectorAll('.picker-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === id);
  });
}

function showAll() {
  showingAll = true;
  document.querySelectorAll('.option').forEach(el => el.classList.add('visible'));
  document.querySelectorAll('.picker-btn').forEach(btn => btn.classList.remove('active'));
  // Change grid to side by side
  grid.style.gridTemplateColumns = showingAll ? '1fr 1fr' : '1fr';
}

// Start with V3 original
selectOption('v3');
</script>
